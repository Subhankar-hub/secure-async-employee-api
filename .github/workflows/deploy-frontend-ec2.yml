name: Deploy frontend to EC2

on:
  push:
    branches: [dev]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend-ec2.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build
        working-directory: frontend
        env:
          VITE_CLIENT_ID: ${{ secrets.VITE_CLIENT_ID }}
          VITE_CLIENT_SECRET: ${{ secrets.VITE_CLIENT_SECRET }}
          VITE_API_BASE_URL: ''
        run: |
          test -n "$VITE_CLIENT_ID"
          test -n "$VITE_CLIENT_SECRET"
          npm ci
          npm run build

      - name: Stage dist
        run: |
          mkdir -p deploy-ui
          cp -a frontend/dist/. deploy-ui/

      - name: Copy dist to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "deploy-ui/"
          target: "/tmp/employee-ui-upload"
          strip_components: 1

      - name: Publish site and reload Nginx
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail
            test -f /tmp/employee-ui-upload/index.html
            mkdir -p /var/www/employee-ui
            rsync -a --delete /tmp/employee-ui-upload/ /var/www/employee-ui/
            sudo systemctl reload nginx
