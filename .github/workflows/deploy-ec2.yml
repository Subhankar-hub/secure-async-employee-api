name: Deploy API to EC2

on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Package
        run: mvn -B -DskipTests package --file pom.xml

      - name: Stage runnable jar
        run: |
          mkdir -p deploy
          shopt -s nullglob
          jars=(target/secure-async-employee-api-*.jar)
          runnable=()
          for j in "${jars[@]}"; do
            [[ "$j" == *-sources.jar || "$j" == *-javadoc.jar ]] && continue
            runnable+=("$j")
          done
          test "${#runnable[@]}" -eq 1
          cp "${runnable[0]}" deploy/app.jar

      - name: Copy jar to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "deploy/app.jar"
          target: "/tmp"
          strip_components: 1

      - name: Install jar and restart
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail
            test -f /tmp/app.jar
            mkdir -p /opt/employee-api
            cp /tmp/app.jar /opt/employee-api/app.jar
            sudo systemctl restart employee-api